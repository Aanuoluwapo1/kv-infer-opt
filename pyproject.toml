[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-infer-opt"
version = "0.1.0"
description = "High-Throughput Transformer Inference, PagedAttention/RadixAttention KV-Cache, and GGUF Block Quantization Engine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Aanuoluwapo" }
]
keywords = [
    "llm-inference",
    "paged-attention",
    "radix-attention",
    "kv-cache",
    "quantization",
    "vllm",
    "sglang",
    "llama-cpp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3",
    "numpy>=2.0",
    "transformers>=4.40",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
kv-infer-opt = "kv_infer_opt.cli:main"

[project.urls]
Homepage = "https://github.com/Aanuoluwapo1/kv-infer-opt"
Repository = "https://github.com/Aanuoluwapo1/kv-infer-opt"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
